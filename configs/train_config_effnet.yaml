# EffNet-based ImageTransformPredictor (paper model).
#
# One config, both stages. The active values below target the FINE-TUNE stage on
# negative pairs (scripts/run_tune.py). To PRETRAIN on DomainNet
# (scripts/run_train.py), switch to the commented "pretrain" lines.
#
# Images are resized to 300x300; no jpeg artifacts.

training:
  start_epoch: 0
  resume: False
  num_epochs: 50
  batch_size: 32
  device: 'cuda:0'
  checkpoint_interval: 1
  val_size: 0.1
  random_seed: 42
  checkpoint_dir: 'checkpoints/effnet_tune'
  # checkpoint_dir: 'checkpoints/effnet_pretrain'

data:
  tensorboard_logdir: 'logs/effnet_tune'
  # tensorboard_logdir: 'logs/effnet_pretrain'

model:
  model_name: 'effnet'
  initialization_weights_path: 'checkpoints/effnet_pretrain/model_weights.pth'
  # initialization_weights_path: null   # pretrain from scratch
  encoder:
    type: 'efficientnet'
    freeze_image_encoder: False
    out_token_n_embd: 512
  decoder:
    pos_encoding: 'learned'
    rope_base: null
    activation: 'gelu'
    n_embd: 512
    ffn_ratio: 4
    n_head: 8
    n_layer: 3
    max_seq_len: 15
    dropout: 0.1
    bias: False
    bos_token_id: 1
    eos_token_id: 2
    pad_token_id: 0
    vocab_size: 14

optimizer:
  name: 'AdamW'
  lr: 0.0001        # pretrain: 0.001
  weight_decay: 0.01
  betas: [0.9, 0.999]

scheduler:
  milestones: [5, 10, 25, 40]
  gamma: 0.5

augmentation:
  initial_p: 0.3
  milestones: []
  probs: []
