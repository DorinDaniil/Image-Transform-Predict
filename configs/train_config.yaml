training:
  start_epoch: 0
  resume: False
  num_epochs: 50
  batch_size: 8
  device: 'cuda:1'
  checkpoint_interval: 1
  checkpoint_dir: '/home/jovyan/nkiselev/ddorin/project/Image-Transform-Predict/checkpoints/itp_001'

data:
  tensorboard_logdir: '/home/jovyan/nkiselev/ddorin/project/Image-Transform-Predict/logs/itp_001'

model:
  model_name: 'itp_001'
  initialization_weights_path: null
  encoder:
    embedding_dim: 512
    freeze_image_encoder: False
    unfreeze_n_layers: null
  decoder:
    n_embd: 512
    n_head: 8
    n_layer: 3
    max_seq_len: 15
    dropout: 0.1
    bias: False
    bos_token_id: 1
    eos_token_id: 2
    pad_token_id: 0
    vocab_size: 14

optimizer:
  name: 'AdamW'
  lr: 0.001
  weight_decay: 0.01
  betas: [0.9, 0.999]

scheduler:
  milestones: [5, 10]
  gamma: 0.5