# SiamNet contrastive baseline (paper model).
#
# One config, both stages. The active values below target the FINE-TUNE stage on
# negative pairs (scripts/run_tune_siamnet.py). To PRETRAIN on DomainNet
# (scripts/run_train_siamnet.py), switch to the commented "pretrain" lines.

experiment:
  experiment_name: 'matching'

training:
  start_epoch: 0
  num_epochs: 50
  batch_size: 16
  device: 'cuda'
  num_workers: 2
  checkpoint_interval: 1
  contrastive_regularizer: True
  checkpoint_dir: 'checkpoints/siamnet_tune'
  # checkpoint_dir: 'checkpoints/siamnet_pretrain'

model:
  initialization_weights_path: 'checkpoints/siamnet_pretrain/model_weights.pth'
  # initialization_weights_path: null   # pretrain from scratch

data:
  tensorboard_logdir: 'logs/siamnet_tune'
  # tensorboard_logdir: 'logs/siamnet_pretrain'

optimizer:
  name: 'AdamW'  # 'Adam' or 'AdamW'
  lr: 0.0001
  weight_decay: 0.01
  betas: [0.9, 0.999]

scheduler:
  milestones: [5, 10]
  gamma: 0.5

regularizer:
  margin: 0.5
  lambda: 0.05
