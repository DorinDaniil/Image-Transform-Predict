training:
  start_epoch: 0
  resume: False
  num_epochs: 50
  batch_size: 16
  device: 'cuda:1'
  checkpoint_interval: 1
  checkpoint_dir: '/home/jovyan/nkiselev/ddorin/project/Image-Transform-Predict/checkpoints/itp_004'

data:
  tensorboard_logdir: '/home/jovyan/nkiselev/ddorin/project/Image-Transform-Predict/logs/itp_004'

model:
  model_name: 'itp_004'
  initialization_weights_path: null
  encoder:
    encoder_emb_dim: 512
    freeze_image_encoder: False
    combined_emb_dim: null
    use_fuser: False
  decoder:
    n_embd: 1024
    n_hidden_state: 2048
    n_head: 8
    n_layer: 3
    max_seq_len: 15
    dropout: 0.1
    bias: False
    bos_token_id: 1
    eos_token_id: 2
    pad_token_id: 0
    vocab_size: 13

optimizer:
  name: 'AdamW'
  lr: 0.001
  weight_decay: 0.01
  betas: [0.9, 0.999]

scheduler:
  milestones: [5, 10]
  gamma: 0.5