training:
  start_epoch: 0
  resume: True
  num_epochs: 30
  batch_size: 32
  device: "cuda"
  checkpoint_interval: 1
  checkpoint_dir: "/mnt/DATA2/dorin/Image-Transform-Predict/checkpoints/itp_vit_qformer_tune_simple"

data:
  tensorboard_logdir: "/mnt/DATA2/dorin/Image-Transform-Predict/logs/itp_vit_qformer_tune_simple"

model:
  model_name: "itp_vit_qformer"
  # базовые веса исходной ViT-модели (без Q-Former), откуда берём backbone и декодер
  initialization_weights_path: "/mnt/DATA2/dorin/Image-Transform-Predict/checkpoints/itp_vit_qformer_tune_simple/checkpoint_epoch_6.pth"
  encoder:
    type: "vit"
    freeze_image_encoder: False       # используется только внутри ViT-обёртки
    out_token_n_embd: 512
    # параметры Q-Former-подобного компрессора
    num_queries: 32
    num_qformer_layers: 2
    qformer_n_head: 8
    qformer_dropout: 0.1 # если не указать qformer_dropout, он возьмёт decoder.dropout
  decoder:
    pos_encoding: "learned"
    rope_base: null
    activation: "gelu"
    n_embd: 512
    ffn_ratio: 4
    n_head: 8
    n_layer: 3
    max_seq_len: 15
    dropout: 0.1
    bias: False
    bos_token_id: 1
    eos_token_id: 2
    pad_token_id: 0
    vocab_size: 14

optimizer:
  name: "AdamW"
  lr: 0.0001
  weight_decay: 0.01
  betas: [0.9, 0.999]

scheduler:
  # milestones: [20, 40]
  milestones: [2, 4, 6, 8, 10, 12]
  gamma: 0.8

augmentation:
  initial_p: 0.3
  milestones: []
  probs: []

